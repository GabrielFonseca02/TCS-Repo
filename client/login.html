<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClimaQC — Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <p>ClimaQC</p>
  <p>Qualidade e Preparação de Dados Climáticos</p>
</header>

<main>
  <h1>Entrar</h1>

  <form action="index.html" method="post">
    <fieldset>
      <legend>Dados de acesso</legend>

      <p>
        <label for="email">E-mail</label><br>
        <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
      </p>

      <p>
        <label for="senha">Senha</label><br>
        <input type="password" id="senha" name="senha" required>
      </p>

      <p>
        <button type="submit">Entrar</button>
      </p>
    </fieldset>
  </form>

  <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
</main>

<footer>
  <p>ClimaQC — Protótipo em desenvolvimento</p>
</footer>

</body>
</html>
